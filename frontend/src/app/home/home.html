<section id="center" aria-labelledby="welcome-title">
  <div class="hero" aria-hidden="true">
    <img src="hero.png" class="base" width="170" height="179" alt="" />
    <img src="angular.svg" class="framework" alt="" />
  </div>
  <div>
    <h1 id="welcome-title">JACK</h1>
    <p>Um bestiário digital das ameaças do RPG Ordem Paranormal.</p>
  </div>
  <button type="button" class="counter" (click)="increment()">Contador: {{ count() }}</button>
</section>

<div class="ticks" aria-hidden="true"></div>

<section id="next-steps" aria-label="Recursos do projeto">
  <div id="docs">
    <svg class="icon" role="presentation" aria-hidden="true">
      <use href="icons.svg#documentation-icon"></use>
    </svg>
    <h2>Documentação</h2>
    <p>Conheça o Angular</p>
    <ul>
      <li>
        <a href="https://angular.dev/overview" target="_blank" rel="noopener noreferrer">
          <img class="button-icon" src="angular.svg" alt="" />
          Angular
        </a>
      </li>
      <li>
        <a href="https://angular.dev/tutorials" target="_blank" rel="noopener noreferrer">
          Tutoriais
        </a>
      </li>
    </ul>
  </div>
  <div id="social">
    <svg class="icon" role="presentation" aria-hidden="true">
      <use href="icons.svg#social-icon"></use>
    </svg>
    <h2>Projeto JACK</h2>
    <p>Journal of Analytics, Creatures &amp; Knowledge</p>
    <ul>
      <li>
        <a
          href="https://github.com/Davizitos57/journal-of-analytics-creatures-knowledge"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="button-icon" role="presentation" aria-hidden="true">
            <use href="icons.svg#github-icon"></use>
          </svg>
          GitHub
        </a>
      </li>
    </ul>
  </div>
</section>

<div class="ticks" aria-hidden="true"></div>
<section id="spacer" aria-hidden="true"></section>
