spring:
  datasource:
    url: jdbc:h2:mem:jacktest;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/jack
          jwk-set-uri: http://localhost:8082/realms/jack/protocol/openid-connect/certs

keycloak:
  admin:
    url: http://localhost:8082
    realm: jack
    client-id: teste
    client-secret: teste